[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for DocuCrew, a multi-document RAG app powered by CrewAI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "chromadb>=1.1.1",
    "crewai>=1.6.1",
    "crewai-tools>=1.6.1",
    "fastapi>=0.136.3",
    "langchain-text-splitters>=1.1.2",
    "mcp>=1.27.2",
    "openai>=2.41.0",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.13.0",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "sqlmodel>=0.0.38",
    "tavily-python>=0.7.25",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pylint>=4.0.6",
    "pyright>=1.1.409",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
src = ["app", "tests"]
line-length = 120
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F821"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pyright]
include = ["app", "tests"]
exclude = ["alembic", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
